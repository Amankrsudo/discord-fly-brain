<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" font-family="sans-serif">
  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="16" font-weight="bold">
    Two-gate constrained model (model-derived, conditional)
  </text>
  <text x="300" y="44" text-anchor="middle" font-size="10" fill="#555">
    Outputs are MODEL-DERIVED, not native measurements. Gate A and B: NOT AUTHORIZED.
  </text>

  <!-- Left: Contact-local patch -->
  <rect x="40" y="70" width="160" height="120" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="120" y="95" text-anchor="middle" font-size="11" font-weight="bold">Contact-local patch</text>
  <text x="120" y="118" font-size="10">One of 43 MaleCNS contacts</text>
  <text x="120" y="136" font-size="10">Projected to unique SWC node</text>
  <text x="120" y="154" font-size="9">Type=0 (format code, not biology) [C-203]</text>
  <text x="120" y="172" font-size="9">A = 2π·r·ℓ</text>
  <text x="120" y="188" font-size="9">Cpatch = A·Cm; gleak = A/Rm</text>
  <text x="120" y="206" font-size="9" fill="#555">MODEL-DERIVED [C-601]</text>

  <!-- Middle: Abstract bridge -->
  <rect x="220" y="90" width="160" height="140" rx="4" fill="#dcfce8" stroke="#166534" stroke-width="1.5"/>
  <text x="300" y="115" text-anchor="middle" font-size="11" font-weight="bold">Abstract cable bridge</text>
  <text x="300" y="138" font-size="10">Length: 112.5 µm</text>
  <text x="300" y="156" font-size="10">Diameter: 2 µm</text>
  <text x="300" y="174" font-size="10">From Augustin 2019 (GFS)</text>
  <text x="300" y="192" font-size="9" fill="#666">NOT mapped to MaleCNS SWC [C-201]</text>
  <text x="300" y="210" font-size="9" fill="#666">MODEL-DERIVED [C-402]</text>

  <!-- Right: Gates and sensitivity -->
  <rect x="400" y="70" width="160" height="200" rx="4" fill="#fecaca" stroke="#991b1b" stroke-width="1.5"/>
  <text x="480" y="95" text-anchor="middle" font-size="11" font-weight="bold">Closed gates</text>
  <text x="480" y="118" font-size="9" fill="#991b1b">Gate A: spatial transfer</text>
  <text x="480" y="134" font-size="8" fill="#991b1b">NOT AUTHORIZED [C-401]</text>
  <text x="480" y="154" font-size="9" fill="#991b1b">Gate B: Dα7 conductance</text>
  <text x="480" y="170" font-size="8" fill="#991b1b">NOT AUTHORIZED [C-501]</text>
  <text x="480" y="196" text-anchor="middle" font-size="10">Sensitivity grid</text>
  <text x="480" y="212" font-size="8">15,528 rows: 9,288 + 2,880 + 2,880 + 480</text>
  <text x="480" y="230" font-size="8">dt=0.01 ms × 15 ms</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#083344"/>
    </marker>
  </defs>
  <path d="M200,120 L220,140" stroke="#083344" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <path d="M380,120 L400,140" stroke="#083344" stroke-width="1.5" marker-end="url(#arrow5)"/>

  <!-- Footer -->
  <text x="300" y="490" text-anchor="middle" font-size="8" fill="#666">
    Bridge geometry from Augustin et al. 2019 (eLife/EuroNeuro, DOI 10.1523/ENEURO.0423-18.2019).
    Source: analyze_mn5_two_gate_constraint_model.py (GFS_BRIDGE_LENGTH_UM = 112.5,
    GFS_BRIDGE_DIAMETER_UM = 2.0) [C-402, C-601]. Outputs are MODEL-DERIVED.
  </text>
</svg>