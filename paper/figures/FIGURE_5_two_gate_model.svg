<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" font-family="Arial, sans-serif">
<rect width="1000" height="570" fill="#fff"/>
<text x="500" y="32" text-anchor="middle" font-size="22" font-weight="bold">Two-gate constrained model</text>
<text x="500" y="56" text-anchor="middle" font-size="14" fill="#555">Conditional model outputs are MODEL-DERIVED, not native measurements</text>
<rect x="35" y="90" width="285" height="255" rx="12" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<text x="177" y="122" text-anchor="middle" font-size="17" font-weight="bold">Contact-local patch</text>
<text x="60" y="160" font-size="14">• One of 43 MaleCNS contacts</text>
<text x="60" y="188" font-size="14">• Projected to a unique SWC node</text>
<text x="60" y="216" font-size="14">• Type=0 is a format code</text>
<text x="76" y="237" font-size="14">—not biological annotation</text>
<text x="60" y="270" font-size="14">• Patch area A = 2πrℓ</text>
<text x="60" y="298" font-size="14">• Uses assumed Cm and Rm</text>
<text x="177" y="325" text-anchor="middle" font-size="14" font-weight="bold">MODEL-DERIVED [C-601]</text>
<rect x="357" y="90" width="285" height="255" rx="12" fill="#dcfce8" stroke="#166534" stroke-width="2"/>
<text x="499" y="122" text-anchor="middle" font-size="17" font-weight="bold">Abstract cable bridge</text>
<text x="382" y="160" font-size="14">• Length: 112.5 µm</text>
<text x="382" y="188" font-size="14">• Diameter: 2 µm</text>
<text x="382" y="216" font-size="14">• Based on published GFS</text>
<text x="398" y="237" font-size="14">motor-neuron geometry</text>
<text x="382" y="270" font-size="14">• Not mapped to MaleCNS SWC</text>
<text x="382" y="298" font-size="14">• Not a per-contact transfer</text>
<text x="499" y="325" text-anchor="middle" font-size="14" font-weight="bold">MODEL-DERIVED [C-402]</text>
<rect x="679" y="90" width="285" height="255" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
<text x="821" y="122" text-anchor="middle" font-size="17" font-weight="bold">Closed authorization gates</text>
<text x="704" y="164" font-size="15" font-weight="bold" fill="#991b1b">Gate A: spatial voltage transfer</text>
<text x="704" y="188" font-size="14" fill="#991b1b">NOT AUTHORIZED [C-401]</text>
<text x="704" y="230" font-size="15" font-weight="bold" fill="#991b1b">Gate B: native Dα7 conductance</text>
<text x="704" y="254" font-size="14" fill="#991b1b">NOT AUTHORIZED [C-501]</text>
<text x="821" y="293" text-anchor="middle" font-size="14">15,528 conditional rows</text>
<text x="821" y="316" text-anchor="middle" font-size="12" fill="#555">Sensitivity is not validation</text>
<path d="M320 215 H350" stroke="#334155" stroke-width="2"/><path d="M342 207 L350 215 L342 223" fill="none" stroke="#334155" stroke-width="2"/>
<path d="M642 215 H672" stroke="#334155" stroke-width="2"/><path d="M664 207 L672 215 L664 223" fill="none" stroke="#334155" stroke-width="2"/>
<rect x="35" y="390" width="929" height="105" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="60" y="420" font-size="16" font-weight="bold">Interpretation guardrails</text>
<text x="60" y="448" font-size="14">Geometry is not electrotonic distance. The abstract bridge is not traced onto any MaleCNS skeleton.</text>
<text x="60" y="474" font-size="14">No output authorizes native PSI→MN5 transfer or native Dα7 conductance.</text>
<text x="500" y="535" text-anchor="middle" font-size="12" fill="#555">Sources: Augustin et al. 2019; analyze_mn5_two_gate_constraint_model.py [C-402, C-601]</text>
</svg>