name: Research branch validation

on:
  pull_request:
    branches: [main]
  push:
    branches: ["review/scientific-claim-corrections"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest numpy scipy pandas
      - name: Stage and verify external MN5 SWCs
        run: |
          set -euo pipefail
          TEMP_DIR="$(python -c 'import tempfile; print(tempfile.gettempdir())')"
          BASE="https://storage.googleapis.com/flyem-male-cns/v1.0/segmentation/skeletons-malecns/skeletons-swc"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$BASE/em_801970.swc" -o "$TEMP_DIR/em_801970.swc"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$BASE/em_801295.swc" -o "$TEMP_DIR/em_801295.swc"
          cd "$TEMP_DIR"
          printf '%s  %s\\n' \
            'c4297590219f2d9bbb5038fd190c4c9d38d4a4ecb66dc35cf3f0d915b313f1d2' 'em_801970.swc' \
            'b2c8e23c6b921f2548d239d83d6887be4e69fd919bd6e02ee41b00ad377d3e69' 'em_801295.swc' \
            | sha256sum --check
          python - <<'PY'
          import tempfile
          from pathlib import Path

          root = Path(tempfile.gettempdir())
          expected = {"em_801970.swc": 8520, "em_801295.swc": 7991}
          for filename, expected_nodes in expected.items():
              rows = [
                  line for line in (root / filename).read_text().splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              ]
              if len(rows) != expected_nodes:
                  raise SystemExit(
                      f"{filename}: expected {expected_nodes} nodes, got {len(rows)}"
                  )
              print(f"{filename}: {len(rows)} nodes verified")
          PY
      - name: Run MN5 provenance and gate tests
        run: |
          python -m pytest -q \
            tests/test_reduced_mn5.py \
            tests/test_model_framework.py \
            tests/test_parameter_adoption.py \
            tests/test_malecns_compartment.py \
            tests/test_malecns_contact_path.py \
            tests/test_mn5_spatial_transfer_gate_review.py
      # Broad-suite failures are currently known to include unrelated missing research
      # documents, asset-inventory drift, and externally staged SWCs. Keep this audit
      # visible but non-blocking while the focused MN5/gate suite remains required.
      - name: Audit full test suite (known unrelated baseline failures)
        continue-on-error: true
        run: python -m pytest -q --tb=short --ignore=tests/test_diagnostics.py
      - name: Check whitespace errors
        run: git diff --check

  manuscript-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install figure-generator dependency
        run: python -m pip install numpy
      - name: Regenerate manuscript figures and tables
        run: python paper/scripts/generate_figures_tables.py
      - name: Check generated package for whitespace errors
        run: git diff --check
      - name: Install review PDF toolchain
        run: python -m pip install "Markdown==3.7" "WeasyPrint==62.3" "pydyf==0.10.0" "pypdf==5.1.0"
      - name: Build review-only manuscript PDF
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python paper/scripts/build_review_pdf.py
      - name: Inspect generated PDF text and page count
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          pdf = Path("build/review-manuscript/REVIEW_ONLY_NOT_FOR_SUBMISSION.pdf")
          reader = PdfReader(str(pdf))
          text = "\\n".join(page.extract_text() or "" for page in reader.pages)
          checks = {
              "review-only warning": "REVIEW ONLY" in text and "NOT FOR SUBMISSION" in text,
              "Gate A remains closed": "NOT AUTHORIZED" in text and "spatial voltage transfer" in text.lower(),
              "Gate B remains closed": "Dα7" in text and "NOT AUTHORIZED" in text,
              "author placeholder visible": "AUTHOR NAMES AND ORDER TO BE CONFIRMED" in text,
              "references included": "Berg2026MaleCNS" in text,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if len(reader.pages) < 10:
              failed.append(f"unexpectedly short PDF ({len(reader.pages)} pages)")
          if failed:
              raise SystemExit("PDF inspection failed: " + "; ".join(failed))
          print(f"PDF text inspection passed: {len(reader.pages)} pages; {pdf.stat().st_size} bytes")
          PY
      - name: Upload review-only PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: review-only-manuscript-pdf
          path: |
            build/review-manuscript/REVIEW_ONLY_NOT_FOR_SUBMISSION.pdf
            build/review-manuscript/REVIEW_ONLY_NOT_FOR_SUBMISSION.html
          if-no-files-found: error
          retention-days: 14
      - name: Validate manuscript source, references, and scientific gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          required = [
              "paper/ABSTRACT_DRAFT.md",
              "paper/INTRODUCTION_DRAFT.md",
              "paper/METHODS_DRAFT.md",
              "paper/RESULTS_DRAFT.md",
              "paper/DISCUSSION_DRAFT.md",
              "paper/CLAIM_EVIDENCE_MAP.md",
              "paper/references.bib",
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit(f"Missing manuscript sources: {missing}")

          bib = (root / "paper/references.bib").read_text(encoding="utf-8")
          entries = re.split(r"(?=^@(?:article|misc|book|inproceedings)\{)", bib, flags=re.M)
          entries = [e for e in entries if e.startswith("@")]
          keys = [re.match(r"^@\w+\{([^,]+)", e).group(1) for e in entries]
          if len(keys) != len(set(keys)):
              raise SystemExit("Duplicate BibTeX keys")
          for e in entries:
              if e.count("{") != e.count("}"):
                  raise SystemExit(f"Unbalanced braces in {e.splitlines()[0]}")
              if not e.rstrip().endswith("}"):
                  raise SystemExit(f"Unterminated BibTeX entry: {e.splitlines()[0]}")

          results = (root / "paper/RESULTS_DRAFT.md").read_text(encoding="utf-8")
          methods = (root / "paper/METHODS_DRAFT.md").read_text(encoding="utf-8")
          evidence = (root / "research/da7_evidence.md").read_text(encoding="utf-8")
          if "Gate A — PSI→MN5 spatial voltage transfer: NOT AUTHORIZED" not in results:
              raise SystemExit("Spatial-transfer gate text missing/changed")
          if "Gate B — Dα7 biological conductance: NOT AUTHORIZED" not in results:
              raise SystemExit("Dα7 gate text missing/changed")
          if "not a native contact-to-soma measurement" not in results:
              raise SystemExit("Model-derived bridge qualification missing")
          if "no established fly-specific functional equivalent" not in methods:
              raise SystemExit("Kir7.1 orthology qualification missing from Methods")
          if "absence of an established" not in evidence:
              raise SystemExit("Kir7.1 evidence qualification missing")
          print(f"Manuscript sources present; {len(keys)} unique BibTeX entries balanced; both gates and wording guardrails verified.")
          PY
